<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Write Board</title>
  <style>
    .container { max-width: 800px; margin: 50px auto; font-family: Arial, sans-serif; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], textarea { width: 100%; padding: 10px; box-sizing: border-box; }
    textarea { height: 200px; }
    .btn-box { text-align: right; margin-top: 20px; }
    .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-save { background: #007bff; color: white; }
    .btn-cancel { background: #6c757d; color: white; text-decoration: none; display: inline-block; }
  </style>
</head>
<body>
<div class="container">
  <h1>Write Board</h1>
  <hr>
  <form id="writeForm">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" placeholder="Enter title">
    </div>
    <div class="form-group">
      <label for="writer">Writer</label>
      <input type="text" id="writer" placeholder="Enter writer">
    </div>
    <div class="form-group">
      <label for="content">Content</label>
      <textarea id="content" placeholder="Enter content"></textarea>
    </div>
    <div class="btn-box">
      <a th:href="@{/boards}" class="btn btn-cancel">Cancel</a>
      <button type="button" class="btn btn-save" onclick="saveBoard()">Save</button>
    </div>
  </form>
</div>

<script>
  function saveBoard() {
      const title = document.getElementById('title').value;
      const writer = document.getElementById('writer').value;
      const content = document.getElementById('content').value;

      if (!title || !writer || !content) {
          alert('Please fill in all fields.');
          return;
      }

      fetch('/api/boards', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: title, writer: writer, content: content })
      }).then(res => {
          if (res.ok) {
              alert('Saved.');
              location.href = '/boards';
          } else {
              alert('Save failed.');
          }
      });
  }
</script>
</body>
</html>
