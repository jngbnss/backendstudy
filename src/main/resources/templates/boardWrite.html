<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>새 글 작성</title>
  <style>
    .container { max-width: 800px; margin: 50px auto; font-family: sans-serif; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], textarea { width: 100%; padding: 10px; box-sizing: border-box; }
    textarea { height: 200px; }
    .btn-box { text-align: right; margin-top: 20px; }
    .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-save { background: #007bff; color: white; }
    .btn-cancel { background: #6c757d; color: white; text-decoration: none; display: inline-block; }
  </style>
</head>
<body>
<div class="container">
  <h1>새 글 작성</h1>
  <hr>
  <form id="writeForm">
    <div class="form-group">
      <label for="title">제목</label>
      <input type="text" id="title" placeholder="제목을 입력하세요">
    </div>
    <div class="form-group">
      <label for="writer">작성자</label>
      <input type="text" id="writer" placeholder="작성자 성함을 입력하세요">
    </div>
    <div class="form-group">
      <label for="content">내용</label>
      <textarea id="content" placeholder="내용을 입력하세요"></textarea>
    </div>
    <div class="btn-box">
      <a th:href="@{/boards}" class="btn btn-cancel">취소</a>
      <button type="button" class="btn btn-save" onclick="saveBoard()">등록하기</button>
    </div>
  </form>
</div>

<script>
  function saveBoard() {
      const title = document.getElementById('title').value;
      const writer = document.getElementById('writer').value;
      const content = document.getElementById('content').value;

      if(!title || !writer || !content) {
          alert("모든 빈칸을 채워주세요!");
          return;
      }

      const data = {
          title: title,
          writer: writer,
          content: content
      };

      // 기존에 만들어둔 Board API (POST /api/boards)를 호출합니다.
      fetch('/api/boards', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
      })
      .then(res => {
          if (res.ok) {
              alert("글이 성공적으로 등록되었습니다!");
              location.href = "/boards"; // 등록 성공 후 목록 페이지로 이동
          } else {
              alert("등록에 실패했습니다.");
          }
      });
  }
</script>
</body>
</html>
