<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세 및 댓글</title>
    <style>
        .container { max-width: 800px; margin: 40px auto; font-family: 'Malgun Gothic', sans-serif; }
        .board-content { border: 1px solid #ddd; padding: 25px; border-radius: 10px; margin-bottom: 30px; }
        .comment-section { background: #f8f9fa; padding: 20px; border-radius: 10px; }
        .comment-list { list-style: none; padding: 0; margin-top: 20px; }
        .comment-item { border-bottom: 1px solid #e9ecef; padding: 15px 0; }
        .comment-author { font-weight: bold; font-size: 0.9em; color: #333; margin-bottom: 5px; }
        .comment-text { margin: 0; color: #555; }

        /* 입력창 스타일 */
        .input-group { margin-bottom: 10px; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; margin-bottom: 10px; }
        textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }

        .btn { padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.9em; }
        .btn-primary { background: #007bff; color: white; margin-top: 10px; }
        .btn-edit { background: #28a745; color: white; margin-right: 5px; }
        .btn-cancel { background: #6c757d; color: white; }

        .comment-actions { margin-top: 10px; }
        .comment-actions a { font-size: 0.85em; text-decoration: none; margin-right: 10px; cursor: pointer; }
        .link-edit { color: #007bff; }
        .link-delete { color: #dc3545; }

        /* 수정 폼 숨김 처리를 위한 클래스 */
        .edit-form { display: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="board-content">
        <h1 th:text="${board.title}">게시글 제목</h1>
        <p>작성자: <strong th:text="${board.writer}">작성자명</strong></p>
        <hr>
        <div th:text="${board.content}" style="min-height: 150px; white-space: pre-wrap;">글 본문 내용...</div>

        <div style="margin-top: 20px;">
            <a th:href="@{/boards}" style="text-decoration: none; color: #007bff;">← 목록으로 돌아가기</a>
        </div>
    </div>

    <div class="comment-section">
        <h3>댓글</h3>

        <div class="comment-form">
            <div class="input-group">
                <input type="text" id="commentWriter" placeholder="작성자 이름">
                <textarea id="commentContent" placeholder="댓글 내용을 입력해 주세요."></textarea>
            </div>
            <button type="button" class="btn btn-primary"
                    th:onclick="submitComment([[${board.id}]])">댓글 등록</button>
        </div>

        <hr>

        <ul class="comment-list">
            <li th:if="${#lists.isEmpty(board.comments)}" style="color: #999; text-align: center;">
                아직 작성된 댓글이 없습니다. 첫 댓글을 남겨보세요!
            </li>

            <li class="comment-item" th:each="comment : ${board.comments}" th:id="'comment-item-' + ${comment.id}">
                <div class="comment-author" th:text="${comment.writer}">작성자</div>

                <p class="comment-text" th:id="'comment-text-' + ${comment.id}" th:text="${comment.content}">댓글 본문</p>

                <div th:id="'edit-wrapper-' + ${comment.id}" class="edit-form">
                    <textarea th:id="'edit-content-' + ${comment.id}" th:text="${comment.content}"></textarea>
                    <div style="margin-top: 5px;">
                        <button class="btn btn-edit" th:onclick="updateComment([[${comment.id}]])">수정 완료</button>
                        <button class="btn btn-cancel" th:onclick="toggleEdit([[${comment.id}]])">취소</button>
                    </div>
                </div>

                <div class="comment-actions" th:id="'comment-btns-' + ${comment.id}">
                    <a href="javascript:void(0)" class="link-edit" th:onclick="toggleEdit([[${comment.id}]])">수정</a>
                    <a href="javascript:void(0)" class="link-delete" th:onclick="deleteComment([[${comment.id}]])">삭제</a>
                </div>
            </li>
        </ul>
    </div>
</div>

<script th:inline="javascript">
    // 1. 댓글 등록 (POST)
    function submitComment(boardId) {
        const writer = document.getElementById('commentWriter').value;
        const content = document.getElementById('commentContent').value;

        if (!writer.trim() || !content.trim()) {
            alert("작성자와 내용을 모두 입력해주세요.");
            return;
        }

        fetch(`/api/boards/${boardId}/comments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ writer: writer, content: content })
        })
        .then(res => {
            if (res.ok) {
                location.reload();
            } else {
                alert("등록에 실패했습니다.");
            }
        });
    }

    // 2. 수정창 토글 (보이기/숨기기)
    function toggleEdit(commentId) {
        const textArea = document.getElementById(`comment-text-${commentId}`);
        const editWrapper = document.getElementById(`edit-wrapper-${commentId}`);
        const btnWrapper = document.getElementById(`comment-btns-${commentId}`);

        if (editWrapper.style.display === "none" || editWrapper.style.display === "") {
            editWrapper.style.display = "block";
            textArea.style.display = "none";
            btnWrapper.style.display = "none";
        } else {
            editWrapper.style.display = "none";
            textArea.style.display = "block";
            btnWrapper.style.display = "block";
        }
    }

    // 3. 댓글 수정 요청 (PUT)
    function updateComment(commentId) {
        const content = document.getElementById(`edit-content-${commentId}`).value;

        if (!content.trim()) {
            alert("내용을 입력해주세요.");
            return;
        }

        fetch(`/api/comments/${commentId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: content })
        })
        .then(res => {
            if (res.ok) {
                alert("수정되었습니다.");
                location.reload();
            } else {
                alert("수정에 실패했습니다.");
            }
        });
    }

    // 4. 댓글 삭제 요청 (DELETE)
    function deleteComment(commentId) {
        if (!confirm("정말 삭제하시겠습니까?")) return;

        fetch(`/api/comments/${commentId}`, {
            method: 'DELETE'
        })
        .then(res => {
            if (res.ok) {
                alert("삭제되었습니다.");
                location.reload();
            } else {
                alert("삭제에 실패했습니다.");
            }
        });
    }
</script>

</body>
</html>
