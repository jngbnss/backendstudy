<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Board List</title>
  <style>
    .container { max-width: 800px; margin: 50px auto; font-family: Arial, sans-serif; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #ddd; padding: 10px; text-align: left; }
    .btn { padding: 5px 10px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; }
  </style>
</head>
<body>
<div class="container">
  <h1>Board List</h1>

  <div style="text-align: right; margin-bottom: 20px;">
    <a th:href="@{/signup}" class="btn" style="background: #6f42c1;">Signup</a>
    <a th:href="@{/boards/write}" class="btn" style="background: #28a745;">Write</a>
  </div>

  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Writer</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="board : ${boards}">
      <td th:text="${board.id}">1</td>
      <td>
        <a th:href="@{/boards/{id}(id=${board.id})}" th:text="${board.title}">Title</a>
      </td>
      <td th:text="${board.writer}">Writer</td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
