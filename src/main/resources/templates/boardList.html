<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>블로그 목록</title>
  <style>
    .container { max-width: 800px; margin: 50px auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #ddd; padding: 10px; text-align: left; }
    .btn { padding: 5px 10px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; }
  </style>
</head>
<body>
<div class="container">
  <h1>전체 게시글 목록</h1>

  <div style="text-align: right; margin-bottom: 20px;">
    <a th:href="@{/boards/write}" class="btn" style="background: #28a745;">새 글 작성하기</a>
  </div>

  <table>
    <thead>
    <tr>
      <th>번호</th>
      <th>제목</th>
      <th>작성자</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="board : ${boards}">
      <td th:text="${board.id}">1</td>
      <td>
        <a th:href="@{/boards/{id}(id=${board.id})}" th:text="${board.title}">제목</a>
      </td>
      <td th:text="${board.writer}">작성자</td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
