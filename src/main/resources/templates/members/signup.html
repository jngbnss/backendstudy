<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page page-narrow">
    <div class="topbar">
        <div>
            <h1 class="page-title">회원가입</h1>
            <p class="page-subtitle">아이디, 이름, 비밀번호를 입력해주세요.</p>
        </div>
    </div>

    <section class="panel">
        <form class="panel-body">
            <div class="form-group">
                <label for="loginId">아이디</label>
                <div class="input-with-button">
                    <input type="text" id="loginId" placeholder="아이디를 입력하세요" oninput="resetLoginIdCheck()">
                    <button type="button" class="btn btn-secondary" onclick="checkLoginId()">중복확인</button>
                </div>
                <p id="loginIdMessage" class="form-message"></p>
            </div>

            <div class="form-group">
                <label for="username">이름</label>
                <input type="text" id="username" placeholder="이름을 입력하세요">
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호를 입력하세요">
            </div>

            <div class="form-actions-split">
                <div class="form-actions-left">
                    <a th:href="@{/login}" class="btn btn-secondary">로그인</a>
                </div>
                <div class="form-actions-right">
                    <a th:href="@{/boards}" class="btn btn-secondary">취소</a>
                    <button type="button" class="btn btn-primary" onclick="signup()">회원가입</button>
                </div>
            </div>
        </form>
    </section>
</main>

<script>
    let isLoginIdChecked = false;
    let checkedLoginId = '';

    function resetLoginIdCheck() {
        isLoginIdChecked = false;
        checkedLoginId = '';
        document.getElementById('loginIdMessage').textContent = '';
        document.getElementById('loginIdMessage').className = 'form-message';
    }

    function checkLoginId() {
        const loginId = document.getElementById('loginId').value.trim();
        const message = document.getElementById('loginIdMessage');

        if (!loginId) {
            message.textContent = '아이디를 입력해주세요.';
            message.className = 'form-message form-message-error';
            return;
        }

        fetch('/api/members/check-login-id?loginId=' + encodeURIComponent(loginId))
            .then(res => res.json())
            .then(available => {
                if (available) {
                    isLoginIdChecked = true;
                    checkedLoginId = loginId;
                    message.textContent = '사용 가능한 아이디입니다.';
                    message.className = 'form-message form-message-success';
                } else {
                    isLoginIdChecked = false;
                    checkedLoginId = '';
                    message.textContent = '이미 존재하는 아이디입니다.';
                    message.className = 'form-message form-message-error';
                }
            });
    }

    function signup() {
        const loginId = document.getElementById('loginId').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!loginId || !username || !password) {
            alert('모든 항목을 입력해주세요.');
            return;
        }

        if (!isLoginIdChecked || checkedLoginId !== loginId) {
            alert('아이디 중복확인을 해주세요.');
            return;
        }

        fetch('/api/members/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                loginId: loginId,
                username: username,
                password: password
            })
        }).then(res => {
            if (res.ok) {
                alert('회원가입이 완료되었습니다.');
                location.href = '/boards';
            } else {
                alert('이미 존재하는 아이디입니다.');
            }
        });
    }
</script>
</body>
</html>
