<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page page-narrow">
    <div class="topbar">
        <div>
            <h1 class="page-title">회원가입</h1>
            <p class="page-subtitle">아이디, 이름, 비밀번호를 입력해주세요.</p>
        </div>
    </div>

    <section class="panel">
        <form class="panel-body">
            <div class="form-group">
                <label for="loginId">아이디</label>
                <input type="text" id="loginId" placeholder="아이디를 입력하세요">
            </div>

            <div class="form-group">
                <label for="username">이름</label>
                <input type="text" id="username" placeholder="이름을 입력하세요">
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호를 입력하세요">
            </div>

            <div class="actions">
                <a th:href="@{/boards}" class="btn btn-secondary">취소</a>
                <button type="button" class="btn btn-primary" onclick="signup()">회원가입</button>
            </div>
        </form>
    </section>
</main>

<script>
    function signup() {
        const loginId = document.getElementById('loginId').value;
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        if (!loginId || !username || !password) {
            alert('모든 항목을 입력해주세요.');
            return;
        }

        fetch('/api/members/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                loginId: loginId,
                username: username,
                password: password
            })
        }).then(res => {
            if (res.ok) {
                alert('회원가입이 완료되었습니다.');
                location.href = '/boards';
            } else {
                alert('회원가입에 실패했습니다.');
            }
        });
    }
</script>
</body>
</html>
