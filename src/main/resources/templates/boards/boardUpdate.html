<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Update Board</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a th:href="@{/boards}" class="brand">Board</a>
    <nav class="site-nav">
      <a th:href="@{/boards}">List</a>
      <a th:href="@{/notifications}">
        Notifications
        <span class="notification-badge" th:if="${unreadNotificationCount > 0}" th:text="${unreadNotificationCount}">0</span>
      </a>
    </nav>
  </div>
</header>
<main class="page">
  <div class="topbar">
    <div>
      <h1 class="page-title">게시글 수정</h1>
      <p class="page-subtitle">제목과 내용을 수정할 수 있습니다.</p>
    </div>
  </div>

  <section class="panel">
    <form id="updateForm" class="panel-body">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" th:value="${board.title}">
      </div>
      <div class="form-group">
        <label for="content">Content</label>
        <textarea id="content" th:text="${board.content}"></textarea>
      </div>
      <div class="form-group">
        <label for="files">Add attachments</label>
        <input type="file" id="files" multiple>
        <p class="form-help">Allowed: jpg, jpeg, png, gif, webp, pdf, txt, zip, doc, docx, xls, xlsx. Max 10MB each.</p>
      </div>
      <div class="actions">
        <a th:href="@{/boards/{id}(id=${board.id})}" class="btn btn-secondary">취소</a>
        <button type="button" class="btn btn-primary" th:onclick="updateBoard([[${board.id}]])">수정</button>
      </div>
    </form>
  </section>
</main>

<script>
  function updateBoard(id) {
      const data = {
          title: document.getElementById('title').value,
          content: document.getElementById('content').value
      };

      fetch(`/api/boards/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
      }).then(async res => {
          if (res.ok) {
              await uploadAttachments(id);
              alert('Updated.');
              location.href = '/boards/' + id;
          } else if (res.status === 401) {
              alert('로그인 후 수정할 수 있습니다.');
              location.href = '/login';
          } else if (res.status === 403) {
              alert('작성자만 수정할 수 있습니다.');
              location.href = '/boards/' + id;
          } else {
              alert('Update failed.');
          }
      });
  }

  async function uploadAttachments(boardId) {
      const files = document.getElementById('files').files;
      if (!files.length) return;

      const formData = new FormData();
      Array.from(files).forEach(file => formData.append('files', file));
      const response = await fetch(`/api/boards/${boardId}/attachments`, {
          method: 'POST',
          body: formData
      });
      if (!response.ok) {
          alert('Attachment upload failed.');
      }
  }
</script>
</body>
</html>
