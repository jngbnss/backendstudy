<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Write Board</title>
  <style>
    .container { max-width: 800px; margin: 50px auto; font-family: Arial, sans-serif; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], textarea { width: 100%; padding: 10px; box-sizing: border-box; }
    textarea { height: 200px; }
    .btn-box { text-align: right; margin-top: 20px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 90px;
      height: 40px;
      padding: 0 20px;
      box-sizing: border-box;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1;
      text-decoration: none;
    }
    .btn-save { background: #007bff; color: white; }
    .btn-cancel { background: #6c757d; color: white; }
    .btn-signup { background: #6f42c1; color: white; }
    .login-required { border: 1px solid #ddd; padding: 30px; text-align: center; border-radius: 6px; }
  </style>
</head>
<body>
<div class="container">
  <h1>Write Board</h1>
  <hr>

  <div th:if="${!isLoggedIn}" class="login-required">
    <p>글작성은 로그인 회원만 가능합니다.</p>
    <div class="btn-box" style="text-align: center;">
      <a th:href="@{/login}" class="btn btn-save">로그인</a>
      <a th:href="@{/signup}" class="btn btn-signup">회원가입</a>
      <a th:href="@{/boards}" class="btn btn-cancel">취소</a>
    </div>
  </div>

  <form th:if="${isLoggedIn}" id="writeForm">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" placeholder="Enter title">
    </div>
    <div class="form-group">
      <label for="content">Content</label>
      <textarea id="content" placeholder="Enter content"></textarea>
    </div>
    <div class="btn-box">
      <a th:href="@{/boards}" class="btn btn-cancel">취소</a>
      <button type="button" class="btn btn-save" onclick="saveBoard()">글작성</button>
    </div>
  </form>
</div>

<script>
  function saveBoard() {
      const title = document.getElementById('title').value;
      const content = document.getElementById('content').value;

      if (!title || !content) {
          alert('Please fill in all fields.');
          return;
      }

      fetch('/api/boards', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: title, content: content })
      }).then(res => {
          if (res.ok) {
              alert('Saved.');
              location.href = '/boards';
          } else if (res.status === 401) {
              alert('로그인 후 글을 작성할 수 있습니다.');
              location.href = '/login';
          } else {
              alert('Save failed.');
          }
      });
  }
</script>
</body>
</html>
