<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Write Board</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a th:href="@{/boards}" class="brand">Board</a>
    <nav class="site-nav">
      <a th:href="@{/boards}">List</a>
      <a th:if="${isLoggedIn}" th:href="@{/boards/bookmarks}">Bookmarks</a>
      <a th:if="${isLoggedIn}" th:href="@{/notifications}">
        Notifications
        <span class="notification-badge" th:if="${unreadNotificationCount > 0}" th:text="${unreadNotificationCount}">0</span>
      </a>
      <a th:if="${isAdmin}" th:href="@{/admin}">Admin</a>
    </nav>
  </div>
</header>
<main class="page">
  <div class="topbar">
    <div>
      <h1 class="page-title">글작성</h1>
      <p class="page-subtitle">로그인한 회원 이름으로 게시글이 등록됩니다.</p>
    </div>
  </div>

  <section th:if="${!isLoggedIn}" class="notice">
    <p>글작성은 로그인 회원만 가능합니다.</p>
    <div class="actions" style="justify-content: center;">
      <a th:href="@{/login}" class="btn btn-primary">로그인</a>
      <a th:href="@{/signup}" class="btn btn-purple">회원가입</a>
      <a th:href="@{/boards}" class="btn btn-secondary">취소</a>
    </div>
  </section>

  <section th:if="${isLoggedIn}" class="panel">
    <form id="writeForm" class="panel-body">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="Enter title">
      </div>
      <div class="form-group">
        <label for="content">Content</label>
        <textarea id="content" placeholder="Enter content"></textarea>
      </div>
      <div class="form-group">
        <label for="files">Attachments</label>
        <input type="file" id="files" multiple>
        <p class="form-help">Allowed: jpg, jpeg, png, gif, webp, pdf, txt, zip, doc, docx, xls, xlsx. Max 10MB each.</p>
      </div>
      <div class="actions">
        <a th:href="@{/boards}" class="btn btn-secondary">취소</a>
        <button type="button" class="btn btn-primary" onclick="saveBoard()">글작성</button>
      </div>
    </form>
  </section>
</main>

<script>
  function saveBoard() {
      const title = document.getElementById('title').value;
      const content = document.getElementById('content').value;

      if (!title || !content) {
          alert('Please fill in all fields.');
          return;
      }

      fetch('/api/boards', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: title, content: content })
      }).then(async res => {
          if (res.ok) {
              const boardId = await res.json();
              await uploadAttachments(boardId);
              alert('Saved.');
              location.href = `/boards/${boardId}`;
          } else if (res.status === 401) {
              alert('로그인 후 글을 작성할 수 있습니다.');
              location.href = '/login';
          } else {
              alert('Save failed.');
          }
      });
  }

  async function uploadAttachments(boardId) {
      const files = document.getElementById('files').files;
      if (!files.length) return;

      const formData = new FormData();
      Array.from(files).forEach(file => formData.append('files', file));
      const response = await fetch(`/api/boards/${boardId}/attachments`, {
          method: 'POST',
          body: formData
      });
      if (!response.ok) {
          alert('Attachment upload failed.');
      }
  }
</script>
</body>
</html>
