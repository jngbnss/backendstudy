<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Board Detail</title>
    <style>
        .container { max-width: 800px; margin: 40px auto; font-family: Arial, sans-serif; }
        .board-content { border: 1px solid #ddd; padding: 25px; border-radius: 10px; margin-bottom: 30px; }
        .reply-section { background: #f8f9fa; padding: 20px; border-radius: 10px; }
        .reply-list { list-style: none; padding: 0; margin-top: 20px; }
        .reply-item { border-bottom: 1px solid #e9ecef; padding: 15px 0; }
        .reply-author { font-weight: bold; font-size: 0.9em; color: #333; margin-bottom: 5px; }
        .reply-text { margin: 0; color: #555; }
        .input-group { margin-bottom: 10px; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; margin-bottom: 10px; }
        textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn { padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.9em; }
        .btn-primary { background: #007bff; color: white; margin-top: 10px; }
        .btn-edit { background: #28a745; color: white; margin-right: 5px; }
        .btn-cancel { background: #6c757d; color: white; }
        .reply-actions { margin-top: 10px; }
        .reply-actions a { font-size: 0.85em; text-decoration: none; margin-right: 10px; cursor: pointer; }
        .link-edit { color: #007bff; }
        .link-delete { color: #dc3545; }
        .edit-form { display: none; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="board-content">
        <h1 th:text="${board.title}">Title</h1>
        <p>Writer: <strong th:text="${board.writer}">Writer</strong></p>
        <hr>
        <div th:text="${board.content}" style="min-height: 150px; white-space: pre-wrap;">Content</div>
        <div style="margin-top: 20px;">
            <a th:href="@{/boards}" style="text-decoration: none; color: #007bff;">Back to list</a>
            <a th:href="@{/boards/update/{id}(id=${board.id})}" style="text-decoration: none; color: #28a745; margin-left: 10px;">Edit</a>
        </div>
    </div>

    <div class="reply-section">
        <h3>Replies</h3>
        <div class="reply-form">
            <div class="input-group">
                <input type="text" id="replyWriter" placeholder="Writer">
                <textarea id="replyContent" placeholder="Enter reply content"></textarea>
            </div>
            <button type="button" class="btn btn-primary" th:onclick="submitReply([[${board.id}]])">Add Reply</button>
        </div>

        <hr>

        <ul class="reply-list">
            <li th:if="${#lists.isEmpty(board.replies)}" style="color: #999; text-align: center;">No replies yet.</li>
            <li class="reply-item" th:each="reply : ${board.replies}" th:id="'reply-item-' + ${reply.id}">
                <div class="reply-author" th:text="${reply.writer}">Writer</div>
                <p class="reply-text" th:id="'reply-text-' + ${reply.id}" th:text="${reply.content}">Reply content</p>
                <div th:id="'edit-wrapper-' + ${reply.id}" class="edit-form">
                    <textarea th:id="'edit-content-' + ${reply.id}" th:text="${reply.content}"></textarea>
                    <div style="margin-top: 5px;">
                        <button class="btn btn-edit" th:onclick="updateReply([[${reply.id}]])">Update</button>
                        <button class="btn btn-cancel" th:onclick="toggleEdit([[${reply.id}]])">Cancel</button>
                    </div>
                </div>
                <div class="reply-actions" th:id="'reply-btns-' + ${reply.id}">
                    <a href="javascript:void(0)" class="link-edit" th:onclick="toggleEdit([[${reply.id}]])">Edit</a>
                    <a href="javascript:void(0)" class="link-delete" th:onclick="deleteReply([[${reply.id}]])">Delete</a>
                </div>
            </li>
        </ul>
    </div>
</div>

<script th:inline="javascript">
    function submitReply(boardId) {
        const writer = document.getElementById('replyWriter').value;
        const content = document.getElementById('replyContent').value;

        if (!writer.trim() || !content.trim()) {
            alert('Please fill in writer and content.');
            return;
        }

        fetch(`/api/boards/${boardId}/replies`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ writer: writer, content: content })
        }).then(res => {
            if (res.ok) {
                location.reload();
            } else {
                alert('Save failed.');
            }
        });
    }

    function toggleEdit(replyId) {
        const textArea = document.getElementById(`reply-text-${replyId}`);
        const editWrapper = document.getElementById(`edit-wrapper-${replyId}`);
        const btnWrapper = document.getElementById(`reply-btns-${replyId}`);

        if (editWrapper.style.display === 'none' || editWrapper.style.display === '') {
            editWrapper.style.display = 'block';
            textArea.style.display = 'none';
            btnWrapper.style.display = 'none';
        } else {
            editWrapper.style.display = 'none';
            textArea.style.display = 'block';
            btnWrapper.style.display = 'block';
        }
    }

    function updateReply(replyId) {
        const content = document.getElementById(`edit-content-${replyId}`).value;

        if (!content.trim()) {
            alert('Please enter content.');
            return;
        }

        fetch(`/api/replies/${replyId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: content })
        }).then(res => {
            if (res.ok) {
                location.reload();
            } else {
                alert('Update failed.');
            }
        });
    }

    function deleteReply(replyId) {
        if (!confirm('Delete this reply?')) return;

        fetch(`/api/replies/${replyId}`, {
            method: 'DELETE'
        }).then(res => {
            if (res.ok) {
                location.reload();
            } else {
                alert('Delete failed.');
            }
        });
    }
</script>
</body>
</html>
