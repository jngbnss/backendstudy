<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Board Detail</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
    <div class="topbar">
        <div>
            <h1 class="page-title" th:text="${board.title}">Title</h1>
            <div class="author-line">
                <div class="avatar">
                    <img th:if="${board.writerProfileImageUrl != null and !#strings.isEmpty(board.writerProfileImageUrl)}"
                         th:src="${board.writerProfileImageUrl}" alt="작성자 프로필">
                    <span th:unless="${board.writerProfileImageUrl != null and !#strings.isEmpty(board.writerProfileImageUrl)}"
                          th:text="${#strings.substring(board.writer, 0, 1)}">W</span>
                </div>
                <div>
                    <p class="page-subtitle">작성자: <strong th:text="${board.writer}">Writer</strong></p>
                    <div class="time-meta">
                        <span th:text="${board.createdAt != null ? '작성 ' + #temporals.format(board.createdAt, 'yyyy.MM.dd HH:mm') : '작성 -'}">작성 2026.05.16 14:32</span>
                        <span th:if="${board.modified}"
                              th:text="${'수정됨 ' + #temporals.format(board.updatedAt, 'yyyy.MM.dd HH:mm')}">수정됨 2026.05.16 15:10</span>
                        <span th:text="${'조회 ' + board.viewCount}">조회 0</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="actions">
            <a th:href="@{/boards}" class="btn btn-secondary">목록</a>
            <a th:if="${isWriter}" th:href="@{/boards/update/{id}(id=${board.id})}" class="btn btn-success">수정</a>
            <button th:if="${isWriter}" type="button" class="btn btn-danger" th:onclick="deleteBoard([[${board.id}]])">삭제</button>
        </div>
    </div>

    <section class="panel">
        <div class="panel-body">
            <div class="content-box" th:text="${board.content}">Content</div>
            <div class="attachments" th:if="${!#lists.isEmpty(board.attachments)}">
                <div class="attachment-grid">
                    <a th:each="attachment : ${board.attachments}"
                       th:if="${attachment.image}"
                       th:href="@{/api/attachments/{id}/download(id=${attachment.id})}"
                       class="attachment-image">
                        <img th:src="${attachment.fileUrl}" th:alt="${attachment.originalFilename}">
                    </a>
                </div>
                <ul class="attachment-list">
                    <li th:each="attachment : ${board.attachments}">
                        <a th:href="@{/api/attachments/{id}/download(id=${attachment.id})}"
                           th:text="${attachment.originalFilename}">file.txt</a>
                        <span th:text="${'(' + attachment.size + ' bytes)'}">(0 bytes)</span>
                        <button th:if="${isWriter}" type="button" class="text-link text-link-danger"
                                th:onclick="deleteAttachment([[${attachment.id}]])">Delete</button>
                    </li>
                </ul>
            </div>
            <div class="reaction-bar">
                <button type="button"
                        class="reaction-btn"
                        th:classappend="${board.liked} ? ' active'"
                        th:onclick="reactBoard([[${board.id}]], 'like')">
                    좋아요 <span th:text="${board.likeCount}">0</span>
                </button>
                <button type="button"
                        class="reaction-btn"
                        th:classappend="${board.disliked} ? ' active'"
                        th:onclick="reactBoard([[${board.id}]], 'dislike')">
                    싫어요 <span th:text="${board.dislikeCount}">0</span>
                </button>
                <button th:if="${isLoggedIn and !isAdmin}" type="button"
                        class="reaction-btn"
                        th:onclick="reportBoard([[${board.id}]])">
                    신고
                </button>
            </div>
        </div>
    </section>

    <section class="panel" style="margin-top: 20px;">
        <div class="panel-body">
            <div class="topbar" style="margin-bottom: 14px;">
                <div>
                    <h2 class="page-title" style="font-size: 22px;">댓글</h2>
                    <p class="page-subtitle">게시글에 대한 의견을 남겨보세요.</p>
                </div>
            </div>

            <div th:if="${isLoggedIn}">
                <div class="form-group">
                    <label for="replyContent">댓글 내용</label>
                    <textarea id="replyContent" placeholder="Enter reply content"></textarea>
                </div>
                <div class="actions">
                    <button type="button" class="btn btn-primary" th:onclick="submitReply([[${board.id}]])">댓글작성</button>
                </div>
            </div>

            <div th:unless="${isLoggedIn}" class="notice">
                <p>댓글 작성은 로그인 회원만 가능합니다.</p>
                <div class="actions" style="justify-content: center;">
                    <a th:href="@{/login}" class="btn btn-primary">로그인</a>
                    <a th:href="@{/signup}" class="btn btn-purple">회원가입</a>
                </div>
            </div>

            <ul class="reply-list">
                <li th:if="${#lists.isEmpty(board.replies)}" class="empty">아직 등록된 댓글이 없습니다.</li>
                <th:block th:each="reply : ${board.replies}" th:with="replyItem=${reply}, boardId=${board.id}">
                    <li th:replace="~{fragments/replyItem :: replyNode}"></li>
                </th:block>
            </ul>
        </div>
    </section>
</main>

<script th:inline="javascript">
    function reactBoard(boardId, reactionType) {
        fetch(`/api/boards/${boardId}/${reactionType}`, {
            method: 'POST'
        }).then(res => {
            if (res.ok) {
                location.reload();
            } else if (res.status === 401) {
                alert('로그인 후 사용할 수 있습니다.');
                location.href = '/login';
            } else {
                alert('처리에 실패했습니다.');
            }
        });
    }

    function submitReply(boardId) {
        const content = document.getElementById('replyContent').value;

        if (!content.trim()) {
            alert('댓글 내용을 입력해주세요.');
            return;
        }

        fetch(`/api/boards/${boardId}/replies`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: content })
        }).then(res => {
            if (res.ok) {
                location.reload();
            } else if (res.status === 401) {
                alert('로그인 후 댓글을 작성할 수 있습니다.');
                location.href = '/login';
            } else {
                alert('Save failed.');
            }
        });
    }

    function reportBoard(boardId) {
        const reason = prompt('신고 사유를 입력하세요.');
        if (!reason || !reason.trim()) return;

        fetch(`/api/boards/${boardId}/reports`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reason: reason })
        }).then(res => {
            if (res.ok) {
                alert('신고가 접수되었습니다.');
            } else if (res.status === 401) {
                alert('로그인이 필요합니다.');
                location.href = '/login';
            } else {
                alert('신고 처리에 실패했습니다.');
            }
        });
    }

    function submitChildReply(boardId, parentReplyId) {
        const content = document.getElementById(`child-content-${parentReplyId}`).value;

        if (!content.trim()) {
            alert('답글 내용을 입력해주세요.');
            return;
        }

        fetch(`/api/boards/${boardId}/replies/${parentReplyId}/children`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: content })
        }).then(res => {
            if (res.ok) {
                location.reload();
            } else if (res.status === 401) {
                alert('로그인 후 답글을 작성할 수 있습니다.');
                location.href = '/login';
            } else {
                alert('Save failed.');
            }
        });
    }

    function toggleChildReply(replyId) {
        const form = document.getElementById(`child-form-${replyId}`);
        if (form.style.display === 'none' || form.style.display === '') {
            form.style.display = 'block';
        } else {
            form.style.display = 'none';
        }
    }

    function toggleEdit(replyId) {
        const textArea = document.getElementById(`reply-text-${replyId}`);
        const editWrapper = document.getElementById(`edit-wrapper-${replyId}`);
        const btnWrapper = document.getElementById(`reply-btns-${replyId}`);

        if (editWrapper.style.display === 'none' || editWrapper.style.display === '') {
            editWrapper.style.display = 'block';
            textArea.style.display = 'none';
            btnWrapper.style.display = 'none';
        } else {
            editWrapper.style.display = 'none';
            textArea.style.display = 'block';
            btnWrapper.style.display = 'flex';
        }
    }

    function updateReply(replyId) {
        const content = document.getElementById(`edit-content-${replyId}`).value;

        if (!content.trim()) {
            alert('Please enter content.');
            return;
        }

        fetch(`/api/replies/${replyId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: content })
        }).then(res => {
            if (res.ok) {
                location.reload();
            } else if (res.status === 401) {
                alert('로그인 후 수정할 수 있습니다.');
                location.href = '/login';
            } else if (res.status === 403) {
                alert('작성자만 수정할 수 있습니다.');
            } else {
                alert('Update failed.');
            }
        });
    }

    function deleteReply(replyId) {
        if (!confirm('Delete this reply?')) return;

        fetch(`/api/replies/${replyId}`, {
            method: 'DELETE'
        }).then(res => {
            if (res.ok) {
                location.reload();
            } else if (res.status === 401) {
                alert('로그인 후 삭제할 수 있습니다.');
                location.href = '/login';
            } else if (res.status === 403) {
                alert('작성자만 삭제할 수 있습니다.');
            } else {
                alert('Delete failed.');
            }
        });
    }

    function deleteBoard(boardId) {
        if (!confirm('게시글을 삭제하시겠습니까?')) return;

        fetch(`/api/boards/${boardId}`, {
            method: 'DELETE'
        }).then(res => {
            if (res.ok || res.status === 204) {
                alert('삭제되었습니다.');
                location.href = '/boards';
            } else if (res.status === 401) {
                alert('로그인 후 삭제할 수 있습니다.');
                location.href = '/login';
            } else if (res.status === 403) {
                alert('작성자만 삭제할 수 있습니다.');
            } else {
                alert('삭제에 실패했습니다.');
            }
        });
    }

    function deleteAttachment(attachmentId) {
        if (!confirm('Delete this attachment?')) return;

        fetch(`/api/attachments/${attachmentId}`, {
            method: 'DELETE'
        }).then(res => {
            if (res.ok || res.status === 204) {
                location.reload();
            } else if (res.status === 401) {
                alert('Login is required.');
                location.href = '/login';
            } else if (res.status === 403) {
                alert('You cannot delete this attachment.');
            } else {
                alert('Attachment delete failed.');
            }
        });
    }
</script>
</body>
</html>
