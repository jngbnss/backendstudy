<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Board List</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
  <div class="topbar">
    <div>
      <h1 class="page-title">게시글 목록</h1>
      <p class="page-subtitle">작성된 글을 확인하고 새 글을 작성할 수 있습니다.</p>
    </div>
    <div class="actions">
      <a th:if="${isLoggedIn}" th:href="@{/members/me}" class="btn btn-primary">프로필수정</a>
      <button th:if="${isLoggedIn}" type="button" class="btn btn-secondary" onclick="logout()">로그아웃</button>
      <a th:unless="${isLoggedIn}" th:href="@{/login}" class="btn btn-primary">로그인</a>
      <a th:unless="${isLoggedIn}" th:href="@{/signup}" class="btn btn-purple">회원가입</a>
      <a th:href="@{/boards/write}" class="btn btn-success">글작성</a>
    </div>
  </div>

  <section class="panel table-wrap">
    <table class="table">
      <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Writer</th>
      </tr>
      </thead>
      <tbody>
      <tr th:if="${#lists.isEmpty(boards)}">
        <td colspan="3" class="empty">아직 등록된 게시글이 없습니다.</td>
      </tr>
      <tr th:each="board : ${boards}">
        <td th:text="${board.id}">1</td>
        <td>
          <a class="title-link" th:href="@{/boards/{id}(id=${board.id})}" th:text="${board.title}">Title</a>
        </td>
        <td th:text="${board.writer}">Writer</td>
      </tr>
      </tbody>
    </table>
  </section>
</main>
<script>
  function logout() {
      fetch('/api/members/logout', {
          method: 'POST'
      }).then(res => {
          if (res.ok) {
              location.href = '/boards';
          } else {
              alert('로그아웃에 실패했습니다.');
          }
      });
  }
</script>
</body>
</html>
