<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
    <style>
        .container { max-width: 500px; margin: 50px auto; font-family: Arial, sans-serif; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; box-sizing: border-box; }
        .btn-box { text-align: right; margin-top: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-save { background: #007bff; color: white; }
        .btn-cancel { background: #6c757d; color: white; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
<div class="container">
    <h1>Signup</h1>
    <hr>

    <form>
        <div class="form-group">
            <label for="username">Name</label>
            <input type="text" id="username" placeholder="Enter name">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter email">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <div class="btn-box">
            <a th:href="@{/boards}" class="btn btn-cancel">Cancel</a>
            <button type="button" class="btn btn-save" onclick="signup()">Signup</button>
        </div>
    </form>
</div>

<script>
    function signup() {
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!username || !email || !password) {
            alert('Please fill in all fields.');
            return;
        }

        fetch('/api/members/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: username,
                email: email,
                password: password
            })
        }).then(res => {
            if (res.ok) {
                alert('Signup complete.');
                location.href = '/boards';
            } else {
                alert('Signup failed.');
            }
        });
    }
</script>
</body>
</html>
