<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>margatsni</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- 좌측 사이드바 -->
<nav class="sidebar">
  <h1 class="logo">램그스타인</h1>

  <ul class="nav-list">
    <li class="nav-item active">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.005 16.545a2.997 2.997 0 0 1 2.997-2.997A2.997 2.997 0 0 1 15 16.545V22h7V11.543L12 2 2 11.543V22h7.005Z"/>
      </svg>
      <span>홈</span>
    </li>
    <li class="nav-item" data-scroll="composer">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 12h20M12 2v20"/>
      </svg>
      <span>만들기</span>
    </li>
    <li class="nav-item disabled" title="아직 없음">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="7.5"/>
        <path d="m16.5 16.5 5 5"/>
      </svg>
      <span>검색</span>
    </li>
    <li class="nav-item disabled" title="아직 없음">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M16.792 3.904A4.989 4.989 0 0 1 21.5 9.122c0 3.072-2.652 4.959-5.197 7.222-2.512 2.243-3.865 3.469-4.303 3.752-.477-.309-2.143-1.823-4.303-3.752C5.152 14.081 2.5 12.194 2.5 9.122a4.989 4.989 0 0 1 4.708-5.218 4.21 4.21 0 0 1 3.675 1.941c.84 1.175.98 1.763 1.12 1.763s.278-.588 1.11-1.766a4.17 4.17 0 0 1 3.679-1.938Z"/>
      </svg>
      <span>좋아요</span>
    </li>
    <li class="nav-item disabled" title="아직 없음">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.5"/>
        <path d="M12 7.5v9M7.5 12h9"/>
      </svg>
      <span>프로필</span>
    </li>
  </ul>
</nav>

<!-- 중앙 피드 -->
<main class="feed">

  <section class="composer" id="composer">
    <div class="composer-head">
      <div class="avatar" id="composer-avatar">?</div>
      <span class="composer-title">무엇이 망했나</span>
    </div>

    <form id="post-form">
      <input type="text" id="title" class="composer-input" maxlength="100"
             placeholder="제목" required>

      <textarea id="content" class="composer-textarea" rows="3"
                placeholder="어쩌다 그렇게 됐는지 적어라" required></textarea>

      <div class="composer-foot">
        <input type="text" id="writer" class="composer-writer" maxlength="20"
               placeholder="닉네임" required>
        <button type="submit" id="submit">공유</button>
      </div>
    </form>

    <p id="message" class="message"></p>
  </section>

  <div id="post-list"></div>

  <p id="empty" class="empty">아직 아무도 망하지 않았다.</p>
  <p id="feed-end" class="feed-end hidden">여기까지가 전부다</p>
</main>

<!-- 우측 사이드바 -->
<aside class="rightbar">
  <div class="me">
    <div class="avatar avatar-lg">램</div>
    <div class="me-text">
      <strong>ramgstein</strong>
      <span>실패담 공유 커뮤니티</span>
    </div>
  </div>

  <div class="suggest">
    <div class="suggest-head">
      <span>최근 망한 사람</span>
      <span class="count" id="count"></span>
    </div>
    <ul id="writer-list" class="writer-list"></ul>
  </div>

  <footer class="rightbar-footer">
    <p>소개 · 도움말 · API · 약관</p>
    <p>© 2026 RAMGSTEIN</p>
  </footer>
</aside>

<script src="/js/post.js"></script>
</body>
</html>
